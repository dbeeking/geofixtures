[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geofixtures"
dynamic = ["version"]
description = "Small, deterministic geospatial test fixtures with verifiable expected results"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GeoFixtures contributors"}]
keywords = ["gis", "geospatial", "testing", "fixtures", "geotiff", "geoparquet", "lidar", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["jsonschema>=4.18", "numpy>=1.26"]

[project.optional-dependencies]
vector = ["pyarrow>=14", "pyproj>=3.6", "shapely>=2.0"]
raster = ["rasterio>=1.3"]
lidar = ["laspy>=2.5", "pyproj>=3.6"]
pytest = ["pytest>=8"]
all = ["geofixtures[vector,raster,lidar,pytest]"]
dev = [
    "geofixtures[all]",
    "build>=1.2",
    "mypy>=1.10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scikit-learn>=1.3",
    "types-jsonschema",
]

[project.scripts]
geofixtures = "geofixtures.cli:main"

[project.entry-points.pytest11]
geofixtures = "geofixtures.pytest_plugin"

[project.entry-points."geofixtures.adapters"]
reference = "geofixtures.adapters.reference:ReferenceAdapter"
landfuse = "geofixtures.adapters.landfuse:LandFuseAdapter"

[tool.setuptools.dynamic]
version = {attr = "geofixtures._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geofixtures = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: tests that materialize the full catalog"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/geofixtures/cases/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/geofixtures"]

[[tool.mypy.overrides]]
module = ["shapely.*", "pyarrow.*", "pyproj.*", "rasterio.*", "laspy.*", "landfuse.*", "sklearn.*", "pytest.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = false
source = ["geofixtures"]
